<div class="modal-form-container">
  <div fxLayout="row" fxLayoutAlign="space-between center" class="modal-header-section">
    <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="12px">
      <div fxLayout="column">
        <h2 class="header-title">Approve Paper</h2>
      </div>
    </div>
    <button pButton type="button" icon="pi pi-times" class="p-button-rounded p-button-text p-button-secondary"
      (click)="onCancel()"></button>
  </div>

  <form [formGroup]="approveFrom">
    <div fxLayout="column" fxLayoutGap="24px">
      <label><b>Status</b></label>

      <!-- <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="24px">
        <div *ngFor="let option of statusOptions">
          <p-radiobutton name="Status" [value]="option.value" [inputId]="option.value" formControlName="Status">
          </p-radiobutton>

          <label [for]="option.value" style="margin-left: 8px; cursor: pointer">
            {{ option.label }}
          </label>
        </div>
      </div> -->

      <div fxLayout="column" fxLayoutGap="8px" fxFlex="1 1 auto">
        <p-floatlabel variant="on" class="float-label-wrapper">
          <p-select [options]="statusOptions" formControlName="Status" optionLabel="label" optionValue="value"
            display="chip" [showClear]="true" styleClass="full-width">
            <ng-template let-item pTemplate="item">
              <div class="flex items-center gap-2">
                <span>{{ item?.label }}</span>
              </div>
            </ng-template>
          </p-select>
          <label for="Status" class="field-label"> Status </label>
        </p-floatlabel>
      </div>


      <div fxLayout="column" fxLayoutGap="8px" fxFlex="1 1 auto"
        *ngIf="data?.Source === 'Journal' &&  userInfo.role !== 'Teacher'">
        <p-floatlabel variant="on" class="float-label-wrapper">
          <p-multiselect [options]="editorial" formControlName="EditorialId" optionLabel="Name" optionValue="Id"
            display="chip" [showClear]="true" styleClass="full-width">
            <ng-template let-item pTemplate="item">
              <div class="flex items-center gap-2">
                <img [src]="item?.ImageUrl" class="rounded-image" />

                <span>{{ item?.Name }}</span>
              </div>
            </ng-template>
          </p-multiselect>
          <label for=" authorsIds" class="field-label"> Editorial </label>
        </p-floatlabel>
      </div>

      <label><b>Remarks</b></label>
      <textarea pInputTextarea rows="4" placeholder="Enter remarks" style="width: 100%"
        formControlName="Remarks"></textarea>
    </div>
  </form>

  <div fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="12px" class="modal-footer-section">
    <button pButton type="button" label="Cancel" icon="pi pi-times" class="p-button-danger btn-cancel"
      (click)="onCancel()"></button>
    <button pButton type="button" label="Save Details" [icon]="isSaving ? 'pi pi-spinner pi-spin' : 'pi pi-check'"
      class="p-button-success btn-save" (click)="onSave2()" [disabled]="approveFrom.invalid || isSaving"></button>
  </div>
</div>
