<app-page-header title="Batch List" (onButtonClick)="AddBatch()"></app-page-header>

<div class="card">
  <p-table #dt2 [columns]="cols" [value]="batches" dataKey="id" [rows]="10" [rowsPerPageOptions]="[10, 25, 50, 100]"
    [paginator]="true" [globalFilterFields]="['Name', 'Year', 'Department.Name']">
    <!-- CAPTION -->
    <ng-template pTemplate="caption">
      <app-table-caption [table]="dt2" [isCsvExportRequired]="true"></app-table-caption>
    </ng-template>

    <!-- HEADER -->
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Year</th>
        <th>Department</th>
        <th>Action</th>
      </tr>
    </ng-template>

    <!-- BODY -->
    <ng-template pTemplate="body" let-batch>
      <tr>
        <td>{{ batch?.Name }}</td>
        <td>{{ batch?.Year }}</td>
        <td>{{ batch?.Department?.Name }}</td>
        <td>
          <button pButton icon="pi pi-pencil" class="p-button-success btn-save m-1"
            (click)="onEditBatch(batch.Id)"></button>

          <button pButton icon="pi pi-trash" class="p-button-danger btn-save m-1"
            (click)="onDeleteBatch(batch.Id)"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
