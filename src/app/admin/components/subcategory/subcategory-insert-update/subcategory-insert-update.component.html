<p-card header="{{ !isEditMode ? 'Add Subcategory' : 'Edit Subcategory' }}">
  <form [formGroup]="subcategoryForm">
    <div>
      <p-floatlabel variant="on">
        <input id="subcategory-name" pInputText class="full-width" formControlName="Name" type="text"
          autocomplete="off" />
        <label for="subcategory-name">Subcategory Name</label>
      </p-floatlabel>

      <p-message *ngIf="subcategoryForm.get('Name')?.invalid" severity="error" size="small" variant="simple"
        text="Please enter a valid subcategory name"></p-message>
    </div>

    <p-floatlabel variant="on">
      <input id="subcategory-code" pInputText class="full-width" formControlName="Code" type="text"
        autocomplete="off" />
      <label for="subcategory-code">Subcategory Code</label>
    </p-floatlabel>

    <p-message *ngIf="subcategoryForm.get('Code')?.invalid" severity="error" size="small" variant="simple"
      text="Please enter a valid subcategory code"></p-message>

    <!-- <div fxLayout="row" style="margin-top: 10px">
      <div fxFlex="13">Status</div>
      <div fxFlex="15">
        <p-toggleswitch formControlName="Status" />
      </div>
      <div fxFlex="20" style="font-weight: 700">
        {{ subcategoryForm.get('Status')?.value ? 'Active' : 'Inactive' }}
      </div>
    </div> -->
    <div>
      <!-- <p-dropdown
        [options]=""
        [(ngModel)]="selectedCity"
        [checkmark]="true"
        optionLabel="name"
        placeholder="Select a City"
      /> -->
    </div>
  </form>
  <ng-template #footer>
    <div fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="8px">
      <p-button label="Cancel" severity="secondary" class="w-full" [outlined]="true" styleClass="w-full"
        (onClick)="onCancel()" />
      <p-button label="{{ isEditMode ? 'Update' : 'Save' }}" class="w-full" styleClass="w-full" (onClick)="onSave()" />
    </div>
  </ng-template>
</p-card>
