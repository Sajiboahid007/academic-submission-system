<div class="login-container" *ngIf="loginForm">
  <p-card class="login-card">
    <ng-template pTemplate="header">
      <div class="login-card-header">
        <h2>Login</h2>
        <p>Enter your credentials</p>
      </div>
    </ng-template>

    <div [formGroup]="loginForm" class="login-form">
      <div class="field-group">
        <label for="StudentId">Student ID</label>
        <input
          id="StudentId"
          pInputText
          class="full-width"
          formControlName="StudentId"
          type="text"
          placeholder="Enter your Student ID"
        />
        <small
          class="field-error"
          *ngIf="loginForm.get('StudentId')?.invalid && loginForm.get('StudentId')?.touched"
        >
          Please enter a valid Student ID
        </small>
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <input
          id="password"
          pInputText
          class="full-width"
          formControlName="Password"
          type="password"
          placeholder="Enter your password"
        />
        <small
          class="field-error"
          *ngIf="loginForm.get('Password')?.invalid && loginForm.get('Password')?.touched"
        >
          Password is required
        </small>
      </div>
    </div>

    <div class="login-actions">
      <p-button label="Cancel" severity="secondary" [outlined]="true"></p-button>
      <p-button
        [label]="loginInProgress ? 'Logging in...' : 'Login'"
        [disabled]="loginInProgress"
        (onClick)="onLogin()"
      ></p-button>
    </div>
  </p-card>
</div>
