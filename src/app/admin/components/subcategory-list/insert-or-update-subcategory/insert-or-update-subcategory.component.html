<div class="modal-form-container">
  <!-- Header Section -->
  <div fxLayout="row" fxLayoutAlign="space-between center" class="modal-header-section">
    <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="12px">
      <div fxLayout="column">
        <h2 class="header-title">Subcategory</h2>
      </div>
    </div>
    <button
      pButton
      type="button"
      icon="pi pi-times"
      class="p-button-rounded p-button-text p-button-secondary"
      (click)="onCancel()"
    ></button>
  </div>

  <form [formGroup]="subcategoryForm">
    <div fxLayout="column" fxLayoutGap="24px">
      <!-- Category Dropdown -->
      <div fxLayout="column" fxLayoutGap="8px">
        <p-floatlabel variant="on" class="float-label-wrapper">
          <p-select
            id="categoryId"
            formControlName="CategoryId"
            [options]="categories"
            optionLabel="Name"
            optionValue="Id"
            [filter]="true"
            filterBy="Name"
            [showClear]="true"
            styleClass="full-width"
          >
          </p-select>
          <label for="categoryId" class="field-label"
            >Select Category <span class="required-asterisk">*</span></label
          >
        </p-floatlabel>
        <p-message severity="error" size="small" variant="simple">
          <span
            *ngIf="
              subcategoryForm.get('CategoryId')?.invalid &&
              subcategoryForm.get('CategoryId')?.touched
            "
            >Category is required.</span
          >
        </p-message>
      </div>

      <div fxLayout="row" fxLayoutGap="24px">
        <!-- SubCategoryName -->
        <div fxLayout="column" fxLayoutGap="8px" fxFlex="1 1 auto">
          <p-floatlabel variant="on" class="float-label-wrapper">
            <input
              pInputText
              id="subcategoryName"
              formControlName="Name"
              autocomplete="off"
              class="full-width"
            />
            <label for="subcategoryName" class="field-label"
              >Subcategory Name <span class="required-asterisk">*</span></label
            >
          </p-floatlabel>
          <p-message severity="error" size="small" variant="simple">
            <span
              *ngIf="subcategoryForm.get('Name')?.invalid && subcategoryForm.get('Name')?.touched"
              >Name is required.</span
            >
          </p-message>
        </div>

        <!-- Code -->
        <div fxLayout="column" fxLayoutGap="8px" fxFlex="1 1 auto">
          <p-floatlabel variant="on" class="float-label-wrapper">
            <input
              pInputText
              id="code"
              formControlName="Code"
              autocomplete="off"
              class="full-width"
            />
            <label for="code" class="field-label"
              >Subcategory Code <span class="required-asterisk">*</span></label
            >
          </p-floatlabel>
          <p-message severity="error" size="small" variant="simple">
            <span
              *ngIf="subcategoryForm.get('Code')?.invalid && subcategoryForm.get('Code')?.touched"
              >Code is required.</span
            >
          </p-message>
        </div>
      </div>

      <!-- Status -->
      <div fxLayout="row" fxLayoutAlign="space-between center" class="status-container">
        <div fxLayout="column" fxLayoutGap="4px">
          <label for="status" class="status-title">Active Status</label>
        </div>
        <div fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="12px">
          <span
            class="status-text"
            [ngClass]="subcategoryForm.get('Status')?.value ? 'active' : 'inactive'"
          >
            {{ subcategoryForm.get('Status')?.value ? 'Active' : 'Inactive' }}
          </span>
          <p-toggleswitch id="status" formControlName="Status"></p-toggleswitch>
        </div>
      </div>
    </div>
  </form>

  <!-- Actions -->
  <div fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="12px" class="modal-footer-section">
    <button
      pButton
      type="button"
      label="Cancel"
      icon="pi pi-times"
      class="p-button-danger btn-cancel"
      (click)="onCancel()"
    ></button>
    <button
      pButton
      type="button"
      label="Save Details"
      icon="pi pi-check"
      class="p-button-success btn-save"
      [disabled]="subcategoryForm.invalid"
      (click)="onSave()"
    ></button>
  </div>
</div>
