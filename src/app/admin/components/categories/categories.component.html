<p-card header="Categories">
  <div fxLayout="row" fxLayoutAlign="space-between center">
    <div fxFlex="15">
      <p-metergroup [value]="meters" [max]="categories.length" />
    </div>
    <div fxFlex="10" fxLayoutAlign="end center">
      <p-button severity="primary" type="button" (click)="AddCategory()"> Add </p-button>
    </div>
  </div>

  <p-divider />

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">
    <ng-container matColumnDef="Name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let category">{{ category.Name }}</td>
    </ng-container>

    <ng-container matColumnDef="Code">
      <th mat-header-cell *matHeaderCellDef>Code</th>
      <td mat-cell *matCellDef="let category">{{ category.Code }}</td>
    </ng-container>

    <!-- <ng-container matColumnDef="Status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let category">
        <p-badge *ngIf="category.Status" value="Active" severity="success" />
        <p-badge *ngIf="!category.Status" value="Inactive" severity="danger" />
      </td>
    </ng-container> -->

    <!-- <ng-container matColumnDef="Image">
      <th mat-header-cell *matHeaderCellDef>Image</th>

      <td mat-cell *matCellDef="let category">

      </td>
    </ng-container> -->

    <ng-container matColumnDef="Action">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let category">
        <button
          mat-icon-button
          color="primary"
          type="button"
          aria-label="Edit"
          (click)="onEditCategory(category.Id)"
        >
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" type="button" aria-label="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator
    [pageSizeOptions]="[5, 10, 20, 50]"
    [pageSize]="5"
    showFirstLastButtons
  ></mat-paginator>
</p-card>
