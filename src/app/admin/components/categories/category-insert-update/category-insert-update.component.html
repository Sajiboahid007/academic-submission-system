<p-card header="{{ !isEditMode ? 'Add Category' : 'Edit Category' }}">
  <form [formGroup]="categoryForm">
    <div>
      <p-floatlabel variant="on">
        <input
          id="category-name"
          pInputText
          class="full-width"
          formControlName="Name"
          type="text"
          autocomplete="off"
        />
        <label for="category-name">Category Name</label>
      </p-floatlabel>

      <p-message
        *ngIf="categoryForm.get('Name')?.invalid"
        severity="error"
        size="small"
        variant="simple"
        text="Please enter a valid category name"
      ></p-message>
    </div>

    <div>
      <p-floatlabel variant="on">
        <input
          id="category-code"
          pInputText
          class="full-width"
          formControlName="Code"
          type="text"
          autocomplete="off"
        />
        <label for="category-code">Category Code</label>
      </p-floatlabel>

      <p-message
        *ngIf="categoryForm.get('Code')?.invalid"
        severity="error"
        size="small"
        variant="simple"
        text="Please enter a valid category code"
      ></p-message>
    </div>

  </form>

  <ng-template #footer>
    <div fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="8px">
      <p-button
        label="Cancel"
        severity="secondary"
        class="w-full"
        [outlined]="true"
        styleClass="w-full"
        (onClick)="onCancel()"
      />
      <p-button
        label="{{ isEditMode ? 'Update' : 'Save' }}"
        class="w-full"
        styleClass="w-full"
        (onClick)="onSave()"
      />
    </div>
  </ng-template>
</p-card>
