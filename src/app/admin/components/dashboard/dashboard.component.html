<div class="layout-container">
  <!-- Navbar -->
  <header class="navbar" [class.sidebar-open]="isSidebarOpen()">
    <div class="navbar-content">
      <div class="navbar-left">
        <button
          class="navbar-toggle"
          (click)="toggleSidebar()"
          aria-label="Toggle sidebar"
          type="button"
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="navbar-brand">
          <h1 class="brand-title">Project & Thesis</h1>
          <span class="brand-subtitle">Approval System</span>
        </div>
      </div>

      <div class="navbar-right">
        <div class="navbar-actions">
          <div class="notification-wrap" #notificationWrap [class.open]="notificationsOpen()">
            <button
              class="action-btn"
              type="button"
              aria-label="Notifications"
              [attr.aria-expanded]="notificationsOpen()"
              aria-haspopup="true"
              aria-controls="notification-panel"
              (click)="toggleNotifications($event)"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              </svg>
              <span class="badge" *ngIf="notifications().length > 0">{{
                notifications().length
              }}</span>
            </button>
            <div
              class="notification-panel"
              id="notification-panel"
              *ngIf="notificationsOpen()"
              role="region"
              aria-label="Notifications"
            >
              <div class="notification-panel-header">
                <span class="notification-panel-title">Notifications</span>
              </div>
              <ul class="notification-list">
                <li *ngIf="notifications().length === 0" class="notification-empty">
                  No notifications yet.
                </li>
                <li *ngFor="let n of notifications()" class="notification-item">
                  <div class="notification-item-top">
                    <span class="notification-title">{{ n.title }}</span>
                    <span
                      class="notification-status"
                      [ngClass]="'notification-status--' + n.status"
                    >
                      {{ statusLabel(n.status) }}
                    </span>
                  </div>
                  <p class="notification-message">{{ n.message }}</p>
                  <time class="notification-time" [attr.datetime]="n.at.toISOString()">{{
                    n.at | date: 'medium'
                  }}</time>
                </li>
              </ul>
            </div>
          </div>
          <div class="user-menu-wrap" #userMenuWrap [class.open]="userMenuOpen()">
            <button
              type="button"
              class="user-menu-trigger"
              (click)="toggleUserMenu($event)"
              [attr.aria-expanded]="userMenuOpen()"
              aria-haspopup="true"
              aria-controls="user-account-menu"
            >
              <p-avatar
                *ngIf="userInfo?.ImageUrl; else initials"
                [image]="userInfo?.ImageUrl"
                shape="circle"
                size="large"
              >
              </p-avatar>

              <ng-template #initials>
                <p-avatar
                  [label]="userInfo?.Name?.charAt(0)"
                  shape="circle"
                  size="large"
                  styleClass="bg-primary text-white"
                >
                </p-avatar>
              </ng-template>

              <div class="user-info">
                <span class="user-name">{{ userInfo?.Name }}</span>
                <!-- <span class="user-role">{{ userInfo?.Roles.[0].Name }}</span> -->
              </div>
              <svg
                class="user-menu-chevron"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <div class="user-dropdown" id="user-account-menu" *ngIf="userMenuOpen()" role="menu">
              <button
                type="button"
                class="user-dropdown-item"
                role="menuitem"
                (click)="goProfile()"
              >
                Profile
              </button>
              <button
                type="button"
                class="user-dropdown-item"
                role="menuitem"
                (click)="goChangePassword()"
              >
                Change password
              </button>
              <button
                type="button"
                class="user-dropdown-item danger"
                role="menuitem"
                (click)="logout()"
              >
                Log out
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="layout-body">
    <!-- Sidebar -->
    <aside
      class="sidebar"
      [class.open]="isSidebarOpen()"
      [class.collapsed]="isSidebarCollapsed()"
      [class.closed]="!isSidebarOpen()"
    >
      <nav class="sidebar-nav">
        <div class="sidebar-header">
          <div class="sidebar-logo" *ngIf="!isSidebarCollapsed()">
            <!-- <span class="logo-icon">🥗</span> -->
            <span class="logo-text">Approval Hub</span>
          </div>
          <button
            class="sidebar-collapse-btn"
            (click)="toggleSidebarCollapse()"
            aria-label="Collapse sidebar"
            type="button"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
        </div>

        <ul class="nav-menu">
          <li *ngFor="let item of menuItems" class="nav-item">
            <a
              class="nav-link"
              [class.active]="isActiveRoute(item.route)"
              (click)="navigateTo(item.route)"
              [routerLink]="item.route"
              routerLinkActive="active"
              [title]="isSidebarCollapsed() ? item.label : ''"
            >
              <span class="nav-icon">{{ item.icon }}</span>
              <span class="nav-label" *ngIf="!isSidebarCollapsed()">{{ item.label }}</span>
              <span class="nav-tooltip" *ngIf="isSidebarCollapsed()">{{ item.label }}</span>
            </a>
          </li>
        </ul>

        <div class="sidebar-footer" *ngIf="!isSidebarCollapsed()">
          <div class="sidebar-info">
            <p class="info-text">Version 1.0.0</p>
          </div>
        </div>
      </nav>
    </aside>

    <!-- Main Content -->
    <main
      class="main-content"
      [class.sidebar-open]="isSidebarOpen()"
      [class.sidebar-collapsed]="isSidebarCollapsed()"
    >
      <div class="content-wrapper">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
