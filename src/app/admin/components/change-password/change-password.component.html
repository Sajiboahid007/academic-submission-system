<div class="change-password-page">
  <h1 class="page-title">Change password</h1>
  <p class="page-lead">Update your account password. You will use the new password on your next sign-in.</p>

  <form class="password-form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="field-block">
      <label for="current-password">Current password</label>
      <p-password
        id="current-password"
        formControlName="currentPassword"
        [toggleMask]="true"
        [feedback]="false"
        placeholder="Current password"
        styleClass="full-width"
        inputStyleClass="full-width"
        autocomplete="current-password"
      />
      <span
        class="field-error-hint"
        *ngIf="
          form.get('currentPassword')?.invalid && form.get('currentPassword')?.touched
        "
        role="alert"
      >
        Current password is required.
      </span>
    </div>

    <div class="field-block">
      <label for="new-password">New password</label>
      <p-password
        id="new-password"
        formControlName="newPassword"
        [toggleMask]="true"
        placeholder="At least 8 characters"
        styleClass="full-width"
        inputStyleClass="full-width"
        autocomplete="new-password"
      />
      <span
        class="field-error-hint"
        *ngIf="
          form.get('newPassword')?.errors?.['required'] && form.get('newPassword')?.touched
        "
        role="alert"
      >
        New password is required.
      </span>
      <span
        class="field-error-hint"
        *ngIf="
          form.get('newPassword')?.errors?.['minlength'] && form.get('newPassword')?.touched
        "
        role="alert"
      >
        Use at least 8 characters.
      </span>
    </div>

    <div class="field-block">
      <label for="confirm-password">Confirm new password</label>
      <p-password
        id="confirm-password"
        formControlName="confirmPassword"
        [toggleMask]="true"
        [feedback]="false"
        placeholder="Confirm new password"
        styleClass="full-width"
        inputStyleClass="full-width"
        autocomplete="new-password"
      />
      <span
        class="field-error-hint"
        *ngIf="
          form.get('confirmPassword')?.invalid && form.get('confirmPassword')?.touched
        "
        role="alert"
      >
        Please confirm your new password.
      </span>
      <span
        class="field-error-hint"
        *ngIf="form.errors?.['passwordMismatch'] && form.touched"
        role="alert"
      >
        New password and confirmation do not match.
      </span>
    </div>

    <div class="form-actions">
      <button
        pButton
        type="submit"
        label="Update password"
        icon="pi pi-check"
        class="p-button-success"
      ></button>
    </div>
  </form>
</div>
