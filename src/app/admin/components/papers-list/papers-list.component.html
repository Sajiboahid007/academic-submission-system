<app-page-header title="Papers List" (onButtonClick)="AddPapers()"></app-page-header>

<div class="card">
  <p-table
    #dt2
    [value]="papers"
    dataKey="Id"
    [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]"
    [loading]="loading"
    [paginator]="true"
    [globalFilterFields]="[
      'Title',
      'Category.Name',
      'SubCategory.Name',
      'Department.Name',
      'Year',
      'Batches.Name',
    ]"
    [tableStyle]="{ 'min-width': '75rem', 'table-layout': 'fixed' }"
  >
    <!-- Search -->
    <ng-template #caption>
      <div class="flex">
        <p-iconfield iconPosition="left" class="ml-auto">
          <p-inputicon>
            <i class="pi pi-search"></i>
          </p-inputicon>

          <input
            pInputText
            type="text"
            [(ngModel)]="searchValue"
            name="search"
            (input)="dt2.filterGlobal($any($event.target).value, 'contains')"
            placeholder="Search papers"
          />
          <p-button
            class="ml-2"
            label="Clear"
            [outlined]="true"
            icon="pi pi-filter-slash"
            (click)="clear(dt2)"
          />
        </p-iconfield>
      </div>
    </ng-template>

    <!-- Header -->
    <ng-template #header>
      <tr>
        <th style="width: 30%">Title</th>
        <th style="width: 14%">Category</th>
        <th style="width: 14%">Sub Category</th>
        <th style="width: 14%">Department</th>
        <th style="width: 14%">Year</th>
        <th style="width: 14%">Batch</th>
      </tr>

      <!-- Filter Row -->
      <tr>
        <th style="width: 30%">
          <p-columnFilter type="text" field="Title" placeholder="Search Title"></p-columnFilter>
        </th>

        <th style="width: 10%; max-width: 10%">
          <p-columnFilter field="Category.Name" matchMode="equals" [showMenu]="false">
            <ng-template #filter let-value let-filter="filterCallback">
              <p-select
                appendTo="body"
                [ngModel]="value"
                [options]="categories"
                optionLabel="Name"
                optionValue="Name"
                placeholder="Select Category"
                [showClear]="true"
                (onChange)="filter($event.value)"
                style="width: 84%"
              >
                <ng-template let-option #item>
                  <span>{{ option.Name }}</span>
                </ng-template>
              </p-select>
            </ng-template>
          </p-columnFilter>
        </th>

        <th style="width: 10%">
          <p-columnFilter field="SubCategory.Name" matchMode="equals" [showMenu]="false">
            <ng-template #filter let-value let-filter="filterCallback">
              <p-select
                appendTo="body"
                [ngModel]="value"
                [options]="subCategories"
                optionLabel="Name"
                optionValue="Name"
                placeholder="Select Sub Category"
                [showClear]="true"
                (onChange)="filter($event.value)"
                style="width: 73%"
              >
                <ng-template let-option #item>
                  <span>{{ option.Name }}</span>
                </ng-template>
              </p-select>
            </ng-template>
          </p-columnFilter>
        </th>

        <th style="width: 12%; max-width: 14%">
          <p-columnFilter field="Department.Name" matchMode="equals" [showMenu]="false">
            <ng-template #filter let-value let-filter="filterCallback">
              <p-select
                appendTo="body"
                [ngModel]="value"
                [options]="departments"
                optionLabel="Name"
                optionValue="Name"
                placeholder="Select Department"
                [showClear]="true"
                (onChange)="filter($event.value)"
                style="width: 74%"
              >
                <ng-template let-option #item>
                  <span>{{ option.Name }}</span>
                </ng-template>
              </p-select>
            </ng-template>
          </p-columnFilter>
        </th>

        <th style="width: 8%">
          <p-columnFilter field="Year" matchMode="equals" [showMenu]="false">
            <ng-template #filter let-value let-filter="filterCallback">
              <p-select
                appendTo="body"
                [ngModel]="value"
                [options]="years"
                placeholder="Select Year"
                [showClear]="true"
                (onChange)="filter($event.value)"
                style="width: 94%"
              ></p-select>
            </ng-template>
          </p-columnFilter>
        </th>

        <th style="width: 10%">
          <p-columnFilter field="Batches.Name" matchMode="equals" [showMenu]="false">
            <ng-template #filter let-value let-filter="filterCallback">
              <p-select
                appendTo="body"
                [ngModel]="value"
                [options]="batches"
                optionLabel="Name"
                optionValue="Name"
                placeholder="Select Batch"
                [showClear]="true"
                (onChange)="filter($event.value)"
                style="width: 84%"
              >
                <ng-template let-option #item>
                  <span>{{ option.Name }}</span>
                </ng-template>
              </p-select>
            </ng-template>
          </p-columnFilter>
        </th>
      </tr>
    </ng-template>

    <!-- Body -->
    <ng-template #body let-paper>
      <tr>
        <td style="width: 30%">{{ paper.Title }}</td>

        <td style="width: 14%">{{ paper.Category?.Name }}</td>

        <td style="width: 14%">{{ paper.SubCategory?.Name }}</td>

        <td style="width: 14%">{{ paper.Department?.Name }}</td>

        <td style="width: 14%">{{ paper.Year }}</td>

        <td style="width: 14%">{{ paper.Batches?.Name }}</td>
      </tr>
    </ng-template>

    <!-- Empty Message -->
    <ng-template #emptymessage>
      <tr>
        <td colspan="6">No papers found.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
