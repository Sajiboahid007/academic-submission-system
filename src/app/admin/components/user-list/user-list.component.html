<app-page-header title="User List" (onButtonClick)="addUser()"></app-page-header>

<div class="card">
  <p-table [value]="users" #dt2 dataKey="id" [rows]="10" [rowsPerPageOptions]="[10, 25, 50, 100]" [paginator]="true"
    [globalFilterFields]="['Name', 'Email', 'StudentId', 'Roles.Name', 'Department.Name']">
    <!-- CAPTION -->
    <ng-template pTemplate="caption">
      <app-table-caption [table]="dt2"></app-table-caption>
    </ng-template>

    <ng-template #header>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Student</th>
        <th>Role</th>
        <th>Department</th>
        <th>Action</th>
      </tr>
    </ng-template>
    <ng-template #body let-user>
      <tr>
        <td>{{ user?.Name }}</td>
        <td>{{ user?.Email }}</td>
        <td>{{ user?.StudentId }}</td>
        <td>{{ user?.Roles?.Name }}</td>
        <td>{{ user?.Department?.Name }}</td>
        <td>
          <button pButton icon="pi pi-pencil" class="p-button-success btn-save" (click)="onEditUser(user.Id)"></button>

          <button pButton icon="pi pi-trash" class="p-button-danger btn-save" (click)="onDeleteUser(user.Id)"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
